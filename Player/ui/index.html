<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src https://embed.linkwave.example; media-src https:; img-src 'self' data: https://thumb.linkwave.example; object-src 'none'; base-uri 'none'"><title>Linkwave</title><link rel="stylesheet" href="style.css"></head><body>
<aside><header><i class="mark">≈</i> Linkwave</header><div class="sideHead">재생목록<button id="newList" title="목록 만들기">＋</button></div><nav id="lists"></nav><button id="settings" class="sideFoot">⚙　플레이어 설정</button></aside>
<main><section id="libraryHead"><div class="flex"><h1 id="listName"></h1><button id="rename">이름 변경</button></div><form id="addForm"><input id="url" placeholder="유튜브 영상 또는 재생목록 링크" aria-label="유튜브 링크"><button class="accent">목록에 추가</button></form></section>
<section id="deck"><div id="empty"><img id="deckCover" alt="" hidden><div class="record"></div><div class="deckInfo"><small>LINKWAVE</small><h2 id="deckTitle">재생할 곡을 선택하세요</h2><p id="deckCredit"></p></div></div><div id="screen"></div></section>
<div class="flex modebar"><button id="mode">MP3 모드</button><button id="mini">영상 미니창</button><button id="lyricsBtn">가사창</button><button id="captionsBtn">자막 선택</button><button id="thumbnailBtn">썸네일 고르기</button><button id="browser">영상으로 재생</button><button id="musicBrowser">YouTube Music으로 재생</button><button id="musicOfflineSave" title="선택한 곡부터 현재 목록의 Music 고음질 저장본을 확인합니다">목록 고음질 저장</button><button id="musicPaneToggle" aria-expanded="false" hidden>Music 화면 보기</button></div>
<small id="musicOfflineStatus" role="status" aria-live="polite" hidden></small><section id="library"><div class="flex"><h2>트랙 <small id="count"></small></h2><div class="spacer"></div><button id="up" title="위로 이동">↑</button><button id="down" title="아래로 이동">↓</button><button id="renameTrack">곡 이름 변경</button><button id="remove">곡 삭제</button><button id="extract">음원 추출</button></div><div id="tracks" role="listbox" aria-label="트랙"></div></section>
</main><footer><div class="now"><div class="disc">♪</div><div><small id="modeName">영상 모드</small><strong id="playingTitle">재생 대기</strong></div></div><div class="controls"><div class="flex"><button id="shuffle">랜덤 끔</button><button id="prev" title="이전 곡">◀◀</button><button class="accent play" id="play" title="재생 또는 일시정지">▶</button><button id="next" title="다음 곡">▶▶</button><button id="repeat">반복 끔</button></div><div class="timeline"><span id="pos">0:00</span><input type="range" id="seek" min="0" max="1" value="0" step=".1" aria-label="재생 위치"><span id="dur">0:00</span></div></div>
<label class="volumeControl" for="volume"><span>볼륨</span><output id="volumeValue" for="volume">100%</output><input id="volume" type="range" min="0" max="100" value="100" step="1" aria-label="볼륨"></label></footer>
<div id="captionSummary" hidden><span id="captionMessage" role="status" aria-live="polite"></span><button id="readPlainLyrics" hidden>가사 보기</button></div>
<div id="notice" role="status" hidden><span id="message"></span><button id="again" hidden>다시 시도</button><button id="dismiss" title="닫기">×</button></div>
<div id="job" hidden><span id="jobText"></span><button id="cancelJob">취소</button><button id="file" hidden>파일 열기</button><button id="folder" hidden>폴더 열기</button><button id="closeJob" hidden>닫기</button></div>
<dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions"><button id="closeModal">닫기</button><button id="accept" class="accent">확인</button></div></dialog>
<div id="trackMenu" popover="auto" role="menu" aria-label="곡 메뉴"></div>
<script src="core.js"></script><script src="stream.js"></script><script src="app.js"></script><script src="panels.js"></script></body></html>
