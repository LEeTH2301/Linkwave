<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<style>
* { box-sizing: border-box }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent }
body { display: grid; place-items: center }
#stage { position: relative; width: min(100vw, 177.77778vh); aspect-ratio: 16/9; overflow: hidden;
  font: min(2.5vw, 4.44444vh)/normal Roboto, Arial, "Malgun Gothic", sans-serif; color: white }
#area { position: absolute; inset: 2% }
#intro {position:absolute;inset:0;display:grid;place-items:center;text-align:center;white-space:pre-line}
.layer { position: absolute; width: max-content; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere;
  text-align: center; direction: ltr; unicode-bidi: plaintext }
</style></head><body><div id="stage"><div id="area"></div><div id="intro"></div></div><script src="signaling.js"></script></body></html>
